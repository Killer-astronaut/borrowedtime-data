name: Tests

# The parsers are tested against saved copies of the real upstream responses
# (tests/samples/). This keeps an edit to the generator from landing broken;
# the daily refresh is what notices an upstream change.
on:
  push:
    paths: ["build_market_data.py", "tests/**", ".github/workflows/tests.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -W error -m unittest discover -s tests -v
